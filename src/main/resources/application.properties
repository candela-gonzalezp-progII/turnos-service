spring.config.import=optional:file:.env
server.port=8081

# Base de datos propia de turnos (Postgres). Las credenciales vienen del .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Catalogo (servicio hermano)
catalogo.base-url=${CATALOGO_BASE_URL:http://localhost:8080}
catalogo.connect-timeout=2s
catalogo.read-timeout=5s

# Seguridad (JWT HS256). El secreto es el MISMO en catalogo y turnos y viene del .env: nunca en el repo.
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=turnos-service
security.jwt.expiration=1h
security.jwt.service-token-ttl=60s
