services:
  postgres-turnos:
    image: postgres:16
    container_name: turnos_db_container
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-turnos_db}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - turnos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-turnos_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Servicio completo en contenedor:  docker compose --profile app up -d --build
  # (por defecto solo se levanta la base y el servicio se corre con ./gradlew bootRun)
  turnos-service:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres-turnos:5432/${DB_NAME:-turnos_db}
    ports:
      - "8081:8081"
    depends_on:
      postgres-turnos:
        condition: service_healthy
    restart: unless-stopped

volumes:
  turnos_pgdata:
