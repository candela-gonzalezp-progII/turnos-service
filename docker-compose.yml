services:
  postgres-turnos:
    image: postgres:16
    container_name: turnos_db_container
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-turnos_db}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - turnos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-turnos_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  turnos_pgdata:
